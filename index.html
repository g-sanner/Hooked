<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

	<title>Hooked</title>

	<link rel="stylesheet" href="dist/reset.css" />
	<link rel="stylesheet" href="dist/reveal.css" />
	<link rel="stylesheet" href="dist/theme/hooked.css" />

	<!-- Theme used for syntax highlighted code -->
	<link rel="stylesheet" href="dist/plugin/highlight/monokai.css" />
</head>

<body>
	<div class="reveal">
		<div class="slides">
			<section>
				<img src="assets/img/logo.png" alt="Hooked logo"
					style="height: 300px; margin: 0 auto 4rem auto; background: transparent" />
				<p>
					<small><a href="https://www.linkedin.com/in/g-sanner/">Grace Sanner</a>,
						<a href="https://www.linkedin.com/in/wyattbliss/">Wyatt Bliss</a>,
						<a href="https://www.linkedin.com/in/jguerreroskso/">Jerry Guerrero</a>,
						<a href="https://www.linkedin.com/in/nick-loisi-5b0793346/">Nick Loisi</a>, and
						<a href="https://www.linkedin.com/in/rylie-haskell-9a703a2a4/">Rylie Haskell</a></small>
				</p>
			</section>

			<section>
				<img src="assets/img/business-model.png" alt="Key Business Model Components" style="height:auto" />
			</section>

			<section>
				<img src="assets/img/target-market.png" alt="Target Market" style="height:auto" />
			</section>

			<section>
				<img src="assets/img/competitors.png" alt="Competitors" style="height:auto" />
			</section>

			<section>
				<img src="assets/img/sales.png" alt="Sales Data" style="height:auto" />
			</section>

			<section>
				<img src="assets/img/timeline.png" alt="Timeline" style="height:auto" />
			</section>

			<section>
				<img src="assets/img/future-thinking.png" alt="Future Plans" style="height:auto" />
			</section>

			<section>
				<img src="assets/img/end.png" alt="Thanks! Any questions?" style="height:auto" />
			</section>
		</div>
	</div>

	<script src="dist/reveal.js"></script>
	<script src="dist/plugin/notes.js"></script>
	<script src="dist/plugin/markdown.js"></script>
	<script src="dist/plugin/highlight.js"></script>
	<script>
		// More info about initialization & config:
		// - https://revealjs.com/initialization/
		// - https://revealjs.com/config/
		Reveal.initialize({
			hash: true,

			// Learn about plugins: https://revealjs.com/plugins/
			plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
		});
	</script>
</body>

</html>
